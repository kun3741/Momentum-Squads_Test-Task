services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 2s
      retries: 20
  init:
    build: .
    command: python -m app.init
    environment:
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/support
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/support
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      HELPDESK_ALLOWED_ORIGIN: ${HELPDESK_ALLOWED_ORIGIN:-http://mock-helpdesk:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      MOCK_LLM_DELAY_MIN: ${MOCK_LLM_DELAY_MIN:-5}
      MOCK_LLM_DELAY_MAX: ${MOCK_LLM_DELAY_MAX:-30}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-32}
      DB_POOL_TIMEOUT: 0.25
      DB_CONNECT_TIMEOUT: 1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.worker
    environment:
      <<: *env
      DB_POOL_TIMEOUT: 5
      DB_CONNECT_TIMEOUT: 5
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  mock-helpdesk:
    build: .
    command: uvicorn app.mock_helpdesk:app --host 0.0.0.0 --port 8001
    environment:
      <<: *env
      DB_POOL_TIMEOUT: 5
      DB_CONNECT_TIMEOUT: 5
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: ["http", "api:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
