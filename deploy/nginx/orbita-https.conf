server {
    listen 80;
    listen [::]:80;
    server_name orbita.104-207-90-199.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/orbita-support/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orbita.104-207-90-199.sslip.io;

    ssl_certificate /etc/letsencrypt/live/orbita.104-207-90-199.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbita.104-207-90-199.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
