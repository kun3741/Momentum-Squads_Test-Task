name: Verify support service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests and syntax
        run: |
          python -m compileall -q app tests
          python -m pytest -q tests/test_contract.py
      - name: Start PostgreSQL, API, worker and helpdesk mock
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Wait for HTTP readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://localhost:8000/ready', timeout=2) as response:
                      if response.status == 200 and response.read() == b'OK':
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API did not become ready within 90 seconds')
          PY
      - name: End-to-end failure-path checks
        run: python tests/integration.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Stop containers
        if: always()
        run: docker compose down -v
